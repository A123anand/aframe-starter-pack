<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
    
  </head>
  <body>
    <a-assets>
    <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
    <img id="sky1" src="GALAXY.jpg">
    <img id="plane" src="a-c-NqXqLPhdbvU-unsplash.jpg">
    <a-asset-item id="tree-obj" src="Lowpoly_tree_sample.obj"></a-asset-item>
  <a-asset-item id="tree-mtl" src="Lowpoly_tree_sample.mtl"></a-asset-item>
    </a-assets>
    <a-scene>
      <!-- <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9"></a-box> -->
      <!-- <a-sphere position="0 1.12 -400" radius="20" color=" gold"></a-sphere> -->
      <a-sphere position="0 1.12 -500"radius="15" material="color: #fff; emissive: #ffaa00; emissiveIntensity: 2"></a-sphere>
      <!-- <a-light type="point" color="#00ffff" intensity="700" position="0 1.12 -400"></a-light> -->
      <!-- <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder> -->
      <!-- <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane> -->
      <a-sky src="#sky1"></a-sky>
        <a-entity
    obj-model="obj: #tree-obj; mtl: #tree-mtl"
    position="3 0 -5"
    scale="0.2 0.2 0.2"></a-entity>
    <a-entity
    obj-model="obj: #tree-obj; mtl: #tree-mtl"
    position="-3 0 -5"
    scale="0.5 0.5 0.5"></a-entity>
      <a-plane src="#plane" rotation="-90 0 0" height="100" width="100"></a-plane>
      
    </a-scene>
  </body>
</html>
