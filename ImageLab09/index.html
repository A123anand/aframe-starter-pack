<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
     <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-box position="-1 0.5 -3" rotation="0 45 0" color=" darkred"></a-box>
      <a-sphere position="0 1.25 -5" radius="1.25" color="blue"></a-sphere>
      <a-sphere position="0 3 -5" radius="1" color="blue"></a-sphere>
      <a-sphere position="0 4.5 -5" radius="0.75" color="blue"></a-sphere>
      <!-- <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder> -->
      <a-plane position="0 0.1 -4" rotation="-90 0 0" width="4" height="4" color="grey"></a-plane>
      <a-cone position="0 4.35 -4.5" rotation="90 0 0" radius-bottom="0.15" radius-top="0" height="1.75" color="orange"></a-cone>
      <a-cylinder position="-0.2 4.5 -4.3" rotation="90 0 0" radius="0.05" height="0.2" color="black"></a-cylinder>
      <a-cylinder position="0.2 4.5 -4.3" rotation="90 0 0" radius="0.05" height="0.2" color="black"></a-cylinder>

      <!-- <a-sky color="#ECECEC"></a-sky> -->
      <!-- the enviroment entity includes a sky. Choose from the presets"none, default, contact, egypt, checkerboard, forest, goaland, yavapai, goldmine, threetowers, poison, arches, tron, japan, dream, volcano, starry, osiris, moon" -->
      <a-entity environment="preset:moon; dressingAmount: 500"></a-entity>
    </a-scene>
  </body>
</html>
