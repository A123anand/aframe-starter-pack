<!DOCTYPE html>
<html>
  <head>
    <title>Textures - A-Frame School</title>
    <meta name="description" content="Textures - A-Frame School">
    <script src="https://aframe.io/releases/0.5.0/aframe.min.js"></script>
  </head>
  <body>
    <a-assets>
        <img id="sky1" src="assets/timothy-oldfield-luufnHoChRU-unsplash.jpg">
        <img id="tex1" src="assets/texture2.jpg"> 
        <!-- beach ball and ice cream -->
        <img id="tex2" src="assets/irene-kredenets-ZToCBpyv3aA-unsplash.jpg">
        <img id="tex3" src="assets/texture3.jpg">
        <img id="plane" src="assets/a-c-NqXqLPhdbvU-unsplash.jpg">
      </a-assets>
    <a-scene>
      
      <a-sky src="#sky1" radius="30"></a-sky>
      
      <a-sphere src="#tex1" position="-2 0.5 -4"></a-sphere>
      <a-sphere src="#tex2" radius="0.75" position="0 2 -6"></a-sphere> 
      <a-cone src="#tex3" height="2" radius-top="0.1" position="0 1 -6" rotation="0 0 180"></a-cone>
      

      <a-plane src="#plane" rotation="-90 0 0" height="100" width="100"></a-plane>

      <a-light type="ambient" color="#666"></a-light>
      <a-light type="point" intensity="1" position="2 4 4"></a-light>

    </a-scene>
  </body>
</html>
